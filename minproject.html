<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
</head>

<body>
    <header>
        <h1>Currency Converter</h1>
        <p>Enter an amount,choose your currrncies,and the board update with the converted result</p>
    </header>
    <fieldset>
        <p>Convert</p>
        <label for="name">Amount</label><br>
        <input type="number" id="name" name="name"><br><br>

        <label for="mk">From</label>
        <input type="text" id="mk" name="mk">

        <button type="button" id="symball" aria-label="Swap currencies">⇄</button>

        <label for="dollor">To</label>
        <input type="text" id="dollor"><br><br>

        <button type="button">Covert</button>

        <button type="button">Reset</button>

    </fieldset>

</body>

</html>
