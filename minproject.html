<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header>
    <h1>Currency Converter</h1>
    <p>Enter an amount, choose your currencies, and convert.</p>
  </header>
 
  <main>
    <form id="converter-form">
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" step="any" placeholder="0.00">
        <div class="error-msg" id="amount-error"></div>
      </div>
 
      <div class="pair-row">
        <div class="field">
          <label for="from-currency">From</label>
          <select id="from-currency"></select>
        </div>
 
        <button type="button" id="swap-btn" aria-label="Swap currencies">⇄</button>
 
        <div class="field">
          <label for="to-currency">To</label>
          <select id="to-currency"></select>
        </div>
      </div>
 
      <div class="actions">
        <button type="submit" class="primary">Convert</button>
        <button type="button" id="reset-btn">Reset</button>
      </div>
    </form>
  </main>
 
  <script src="javascript.js"></script>
</body>
</html>
